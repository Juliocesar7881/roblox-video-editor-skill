name: Validate skill
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q roblox-video-editor/scripts install.py tests
      - name: Verify resolution, rotation and public licenses
        run: python -m unittest discover -s tests -v
